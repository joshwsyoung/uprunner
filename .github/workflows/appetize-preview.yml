name: Appetize Preview

on:
  push:
    branches: ["main", "claude/android-dev-plan-pccx38"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Runs the same pure-Kotlin :core suite verified locally before every push, now also
      # gated in CI.
      - name: Run :core unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload to Appetize.io
        id: appetize_upload
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_TOKEN }}
          appFile: app/build/outputs/apk/debug/app-debug.apk
          platform: android

      - name: Publish preview link
        run: |
          echo "Appetize preview: https://appetize.io/embed/${{ steps.appetize_upload.outputs.publicKey }}"
          {
            echo "## 📱 Appetize Preview"
            echo ""
            echo "[Open the emulator](https://appetize.io/embed/${{ steps.appetize_upload.outputs.publicKey }})"
          } >> "$GITHUB_STEP_SUMMARY"
